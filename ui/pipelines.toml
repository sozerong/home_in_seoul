# 파이프라인 정의(손으로 쓴 메타데이터). 화면의 목록, 흐름 레인, 정의 폼과 JSON 보기, 관련 측정, 오류 번호가 여기서 온다.
# 원본 화면: Claude outputs/ui_reference/Pipelines.dc.html. 이 파일로 DAG를 만들지는 않는다(docs/handoff_ui.md 2절).
#
# 규칙
# - dags: DAG 하나 = dag_id와 일정. 일정은 cron 문자열, "manual"(schedule=None), "asset"(Asset 트리거) 중 하나.
#   tests/test_ui_pipelines.py가 dags/*.py의 실제 DAG와 같은지 본다(어긋남 시험). 운영 DAG 9개가 모두 한 번씩 나와야 한다(손으로만 도는 시험 DAG `test_*.py`는 뺀다).
# - 지금 상태를 뜻하는 숫자(행 수, 실행 횟수, 회차, 마지막 실행 시각, 다음 실행)는 적지 않는다. 화면이 DB와 Airflow API에서 읽는다.
# - proofs의 숫자는 과거 측정 기록이라 측정 번호와 함께 둔다(docs/measurements.md가 원본).
# - batch_sources: stg_dbt.batch_status.source 값, ops_sources: ops.quality·ops.freshness의 source 값(한글). 상세 화면이 이 값으로 거른다.
# - records: 상세 화면에 붙일 실행 기록 쿼리 이름(ui/queries.sql). 빌드는 build_runs, 엔진 지표는 engine_runs, 리니지 회차는 lineage_runs.
# - failures는 F 번호만. 제목과 상태는 docs/failure_analysis.md에서 읽는다.
# - yaml이 아니라 toml인 이유: CI(requirements.txt)에 PyYAML이 없고, tomllib은 표준 라이브러리다(판단 U-8).

[[pipeline]]
id = "seoul_api"
kind = "source"
title = "혼잡도 · 역사마스터"
dags = { seoul_api = "30 13 * * 1" }
batch_sources = ["congestion"]
ops_sources = ["혼잡도", "역사마스터"]
trigger = "매주"
chain = "API → Python 파싱 → PostgreSQL jsonb → dbt"
engines = ["Python", "PostgreSQL", "dbt"]
summary = "서울 열린데이터광장 API에서 지하철 혼잡도와 역사마스터를 받는다. 혼잡도는 파싱만 해 jsonb 원본에 담고 정제는 dbt SQL이 한다. 역사마스터는 Python 정제를 유지한다(결정 93)."
meta = [["처리 단위", "수집일"], ["재시도", "0 (영구 오류는 바로 실패)"], ["끝나면", "raw.congestion · stg.station_master Asset → wh_load"]]
flow_note = "받기는 원천 모양 그대로, 꺼내기는 SQL"
failures = []
scenario = "S1 쓰는 필드 이름이 바뀜"
proofs = [
  ["동등 (Python → dbt)", "옛 stg.congestion과 두 방향 EXCEPT ALL 0, 컬럼 이름·순서·타입 같음, 교체 뒤 상품 sha256 같음", "측정 23"],
  ["멱등", "같은 수집일을 다시 넣어도 1,671행", "측정 23"],
  ["원천 이름 변경(S1)", "고칠 곳 5개 파일 → SQL 2줄, 옛 수집일도 함께 처리", "측정 13 → 23"],
]
[[pipeline.lane]]
name = "원천"
engine = "API"
items = [["subwConfusion", "서울교통공사 혼잡도 · 분기"], ["역사마스터", "역 좌표 · 수시"]]
[[pipeline.lane]]
name = "받기"
engine = "Python"
items = [["ingestion.seoul_api", "수집 → lake/"], ["congestion_raw.py", "파싱만, 필드 검사 없음"], ["station_master.py", "Python 정제 유지"]]
[[pipeline.lane]]
name = "원본 층"
engine = "PostgreSQL"
items = [["raw.congestion", "jsonb 원본"], ["stg.station_master", "역 좌표 표"]]
[[pipeline.lane]]
name = "관문"
engine = "dbt"
items = [["batch_status_congestion", "배치 = 수집일. 쓰는 키 · 급감 10% · 칸 중복 · 격리 5%"]]
[[pipeline.lane]]
name = "정제"
engine = "dbt SQL"
items = [["congestion_rows", "뷰 · 행 펼치기"], ["congestion_cells", "뷰 · 30분 칸"], ["stg_dbt.congestion", "표"], ["congestion_quarantine", "격리 표"]]
[[pipeline.lane]]
name = "출력"
engine = "Asset"
items = [["wh_load 깨움", "fact_congestion · dong_profile"]]
[pipeline.form.source]
service = "subwConfusion, 역사마스터"
collect = "python -m ingestion.seoul_api <service> --collected-date $D"
lake = "lake/seoul_subway_congestion/collected_date=YYYY-MM-DD/"
[pipeline.form.parse]
module = "transform.congestion_raw"
rule = "파싱만. 쓰는 필드를 고르지 않는다"
key = "(collected_date, source_file, row_no)"
[pipeline.form.gate]
batch_key = "collected_date"
checks = "keys_present, raw_shrink(10%), cell_unique, quarantine_ratio(5%)"
warn_only = "raw_unknown_keys"
on_reject = "그 배치만 빠지고 직전 승인 배치 사용"
[pipeline.form.clean]
models = "congestion_rows, congestion_cells, congestion, congestion_quarantine"
key_alias = "이름 대응은 매크로 키 목록 + coalesce (결정 64)"
rebuild = "매번 전체 (결정 62)"
[pipeline.form.output]
assets = "raw.congestion, stg.station_master"
next = "wh_load"

[[pipeline]]
id = "molit_rent"
kind = "source"
title = "전월세 실거래"
dags = { molit_rent = "0 13 * * 1" }
batch_sources = ["rent"]
ops_sources = ["전월세"]
trigger = "매주"
chain = "API → Python 파싱 → PostgreSQL jsonb → dbt"
engines = ["Python", "PostgreSQL", "dbt"]
summary = "국토교통부 오피스텔·연립다세대 전월세 API를 구와 계약월로 나눠 받는다. 신고가 늦게 들어오므로 매주 최근 3개월을 다시 받는다. 받은 단위는 jsonb 원본에 담고 정제는 dbt SQL이 한다."
meta = [["처리 단위", "최근 3개월 × 25개 구 × 2종"], ["재시도", "0"], ["끝나면", "raw.rent Asset → wh_load"]]
flow_note = "처리 단위마다 작업 하나 (동적 매핑)"
failures = ["F-2", "F-12"]
scenario = "S2 쓰지 않는 필드가 늘어남, S3 해석 규칙을 정정함"
proofs = [
  ["동등 (Python → dbt)", "첫 대조에서 54행 차이(전각 공백) → py_strip 매크로 → 차이 0, 상품 sha256 같음", "측정 24, F-12"],
  ["무해한 필드 추가(S2)", "실패 0행 → 통과 207행, 경고 1개만", "측정 12 → 24"],
  ["규칙 정정(S3)", "바뀐 단위 58 / 1,352를 쿼리 한 번으로, 빌드 기록에 남음", "측정 14 → 24, 30"],
  ["관문", "9.95%를 깨뜨린 배치만 거절, 다른 출처와 상품은 갱신", "측정 25"],
]
[[pipeline.lane]]
name = "원천"
engine = "API"
items = [["오피스텔 전월세", "국토교통부 · 지역코드 + 계약년월"], ["연립다세대 전월세", "같은 단위"]]
[[pipeline.lane]]
name = "받기"
engine = "Python"
items = [["ingestion.molit_rent", "페이지마다 파일 → lake/"], ["rent_raw.py", "파싱만, 모든 태그를 jsonb로"]]
[[pipeline.lane]]
name = "원본 층"
engine = "PostgreSQL"
items = [["raw.rent", "jsonb 원본 · 처리 단위별"]]
[[pipeline.lane]]
name = "관문"
engine = "dbt"
items = [["batch_status_rent", "배치 = (종류, 수집일, 구, 계약년월). 쓰는 키 · 격리 5%"]]
[[pipeline.lane]]
name = "정제"
engine = "dbt SQL"
items = [["rent_rows", "뷰 · 규칙 C·V"], ["bjd_code", "법정동 코드표 (상가 원본에서)"], ["stg_dbt.rent", "표"], ["rent_quarantine", "격리 표"]]
[[pipeline.lane]]
name = "출력"
engine = "Asset"
items = [["wh_load 깨움", "fact_rent · rent_listing · dong_profile"]]
[pipeline.form.source]
api = "오피스텔·연립다세대 전월세 실거래"
plan = "Variable rent_recent_months=3, 서울 25개 구, offi·rh"
lake = "lake/molit_rent_*/collected_date=YYYY-MM-DD/{구}_{계약년월}_p{n}.xml"
[pipeline.form.parse]
module = "transform.rent_raw"
rule = "파싱만. 새 필드도 jsonb에 남김 (결정 60)"
key = "(source_type, collected_date, source_file, item_no)"
[pipeline.form.gate]
batch_key = "(source_type, collected_date, sgg_cd, deal_ymd)"
checks = "keys_present, quarantine_ratio(5%)"
warn_only = "raw_unknown_keys"
on_reject = "그 처리 단위만 빠짐"
[pipeline.form.clean]
models = "rent_rows, bjd_code, rent, rent_quarantine"
strip = "py_strip 매크로 (Python과 같은 공백 29글자)"
rebuild = "매번 전체 (결정 62)"
[pipeline.form.output]
assets = "raw.rent"
next = "wh_load"

[[pipeline]]
id = "sbiz_store"
kind = "source"
title = "상가정보"
dags = { file_sbiz_store = "manual" }
batch_sources = ["store"]
ops_sources = ["상가정보"]
trigger = "파일 도착"
chain = "파일 → Python 파싱 → PostgreSQL jsonb → dbt"
engines = ["Python", "PostgreSQL", "dbt", "PostGIS"]
summary = "사람이 받은 zip을 inbox에 넣으면 센서가 알아채고 서울 전체 업소를 모든 컬럼째 jsonb 원본에 담는다. 편의 업종 범위는 정제가 아니라 마트의 seed가 정한다(결정 78, 79)."
meta = [["센서", "inbox, 최대 600초"], ["처리 단위", "(수집일, 원천 파일)"], ["재시도", "0"], ["끝나면", "raw.sbiz_store Asset → wh_load"]]
flow_note = "업종 범위는 마트에서 고른다"
failures = ["F-3", "F-4"]
scenario = "S6a 편의 업종 하나 추가"
note = "2026-10-21 Airflow 실행은 센서가 10분 기다린 끝에 실패했다(파일을 손으로 등록). 같은 명령은 손으로 돌려 확인했다."
proofs = [
  ["동등 (6코드 부분)", "옛 stg.sbiz_store 30,394행과 차이 0, bjd_code 466행 차이 0", "측정 27"],
  ["의도한 변경", "다수결을 전체 업소로 → dong_mois_map 427행의 stores·share 바뀜(기록)", "측정 27"],
  ["업종 추가(S6a)", "seed 1줄 + 마트 2개, dong_mois_map 차이 0", "측정 17 → 28"],
]
[[pipeline.lane]]
name = "원천"
engine = "파일"
items = [["상가(상권)정보 zip", "소상공인시장진흥공단 · 분기"]]
[[pipeline.lane]]
name = "받기"
engine = "Python"
items = [["lake/_inbox/sbiz_store", "센서가 기다림"], ["sbiz_store_raw.py", "파싱만, 서울 전체 모든 컬럼"]]
[[pipeline.lane]]
name = "원본 층"
engine = "PostgreSQL"
items = [["raw.sbiz_store", "jsonb 원본"]]
[[pipeline.lane]]
name = "관문"
engine = "dbt"
items = [["store_batch_checks", "배치 검사"], ["batch_status_store", "쓰는 키 · 급감 · 격리 5%"]]
[[pipeline.lane]]
name = "정제"
engine = "dbt SQL"
items = [["store_rows", "뷰 · MF 규칙"], ["stg_dbt.store", "표"], ["store_quarantine", "격리 표"]]
[[pipeline.lane]]
name = "출력"
engine = "Asset"
items = [["wh_load 깨움", "fact_store · map_dong_mois · dong_amenity"]]
[pipeline.form.source]
file = "상가(상권)정보 서울 CSV zip"
inbox = "lake/_inbox/sbiz_store/"
sensor = "poke 30초, 최대 600초, reschedule"
[pipeline.form.parse]
module = "transform.sbiz_store_raw"
rule = "서울 전체 행, 모든 컬럼을 jsonb로 (결정 78)"
[pipeline.form.gate]
batch_key = "(collected_date, source_file)"
checks = "keys_present, raw_shrink, quarantine_ratio(5%)"
on_reject = "그 배치만 빠짐"
[pipeline.form.clean]
models = "store_rows, store, store_quarantine"
scope = "업종 목록은 seed wh.amenity_category (마트에서 고름)"
majority = "행안부 코드 다수결은 전체 업소 (결정 79)"
[pipeline.form.output]
assets = "raw.sbiz_store"
next = "wh_load"

[[pipeline]]
id = "living_migration"
kind = "source"
title = "생활이동"
dags = { file_living_migration = "0 13 21 * *" }
batch_sources = ["living"]
ops_sources = ["생활이동"]
records = "engine_runs"
trigger = "매월 + 파일"
chain = "파일 → Spark 파싱 → Iceberg → Spark SQL → PostgreSQL"
engines = ["Spark", "Iceberg", "Spark SQL", "PostgreSQL"]
summary = "매달 21일부터 inbox에 들어온 행정동 zip을 Spark로 풀어 Iceberg 원본에 담는다(24시간 전체). 관문과 정제, 집계는 Spark SQL 파일 묶음이 하고, 결과(경계 표)만 PostgreSQL로 보낸다."
meta = [["센서", "최대 7일, reschedule"], ["pool", "heavy (한 번에 하나)"], ["끝나면", "stg.living_commute Asset → wh_load"]]
flow_note = "무거운 일은 Spark, 고르는 일은 dbt"
failures = ["F-8", "F-9", "F-13", "F-16", "F-19", "F-20"]
scenario = "S6b 저녁 귀가 시간대 추가"
note = "DAG와 같은 인자로 손으로 1회 성공했다(측정 38). 실행기 1회가 호스트 디스크를 크게 쓰므로 정기 실행 전에 작업 공간 준비가 필요하다(F-20)."
proofs = [
  ["실제 실행", "실행기 3,201초, 10개 달 모두 승인, 경계·판정·격리 표를 한 트랜잭션으로 교체(333.9초)", "측정 38"],
  ["동등 (Python → Spark SQL)", "경계 표에서 다시 만든 commute_od가 옛 표와 같음", "측정 33"],
  ["저녁 귀가 추가(S6b)", "새 마트 파일 1개, Spark 재실행 없음, 기존 상품 차이 0", "측정 18 → 34"],
  ["엔진 비교 (DuckDB)", "자원 상한(16GiB, 임시 공간) 안에서 3회 모두 오류로 끝남. VM은 멈추지 않음", "측정 39"],
]
[[pipeline.lane]]
name = "원천"
engine = "파일"
items = [["생활이동_행정동_YYYYMM.zip", "서울 열린데이터 · 월"]]
[[pipeline.lane]]
name = "받기"
engine = "Spark"
items = [["living_iceberg.py", "파싱만, 대상연월 파티션 덮어쓰기"]]
[[pipeline.lane]]
name = "원본 층"
engine = "Iceberg"
items = [["lh.living.migration_rows", "대상연월 파티션"]]
[[pipeline.lane]]
name = "관문"
engine = "Spark SQL"
items = [["22_batch_status", "배치 = (수집일, 대상연월). 급감 · 격리 5%"], ["stg.living_batch_status", "판정을 PostgreSQL에"]]
[[pipeline.lane]]
name = "정제"
engine = "Spark SQL"
items = [["10_checked · 20_clean", "검증 규칙 V3~V8"], ["21_quarantine", "격리"], ["30_commute", "집계 (grain f)"]]
[[pipeline.lane]]
name = "출력"
engine = "JDBC"
items = [["stg.living_commute", "경계 표"], ["wh_load 깨움", "fact_commute · commute_od"]]
[pipeline.form.source]
file = "생활이동_행정동_YYYYMM.zip"
sensor = "최대 7일, reschedule"
pool = "heavy"
[pipeline.form.parse]
module = "transform.living_iceberg (spark-job)"
table = "lh.living.migration_rows, 파티션 target_ym"
[pipeline.form.gate]
batch_key = "(collected_date, target_ym)"
checks = "shrink(직전 대상연월 대비), quarantine_ratio(5%)"
on_reject = "그 달만 경계 표에서 뺌 (결정 100)"
warn_only = "warn_month_approved"
[pipeline.form.clean]
runner = "transform.spark_sql_runner spark_sql/living"
files = "10_checked, 20_clean, 21_quarantine, 22_batch_status, 30_commute"
tests = "test_population_exact"
grain = "대상연월 × 출발 × 도착 × 평일/주말 × 시간 묶음 × HW·WH × 나이 2구간 (결정 96)"
[pipeline.form.output]
table = "stg.living_commute (JDBC, 비우고 복사 교체)"
save = "stg.living_batch_status, stg.living_quarantine"
next = "wh_load"

[[pipeline]]
