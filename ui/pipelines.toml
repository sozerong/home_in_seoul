meta = [["센서", "inbox"], ["처리 단위", "수집일"], ["정제", "transform/boundary.py"], ["끝나면", "stg.sgis_dong · stg.parcel Asset → wh_load"]]
flow_note = "옮기지 않기로 한 출처"
failures = []
scenario = "걸린 시나리오 없음"
note = "정제 명령은 손으로 돌려 확인했다."
proofs = []
[[pipeline.lane]]
name = "원천"
engine = "파일"
items = [["SGIS 통계지역경계", "EPSG:5179 · 2025년"], ["연속지적도", "필지 도형"]]
[[pipeline.lane]]
name = "받기·정제"
engine = "Python"
items = [["boundary.py sgis_dong", "shp → PostGIS"], ["boundary.py parcel", "shp → PostGIS"]]
[[pipeline.lane]]
name = "결과"
engine = "PostGIS"
items = [["stg.sgis_dong", "행정동 경계"], ["stg.parcel", "필지"]]
[[pipeline.lane]]
name = "출력"
engine = "Asset"
items = [["wh_load 깨움", "dim_dong · dim_parcel"]]
[pipeline.form.source]
files = "SGIS 통계지역경계(읍면동), 연속지적도 shp"
inbox = "lake/_inbox/sgis_boundary, parcel_boundary"
[pipeline.form.clean]
module = "transform.boundary sgis_dong | parcel"
why_python = "도형, PostGIS 공간 연산 (결정 93)"
[pipeline.form.output]
assets = "stg.sgis_dong, stg.parcel"
next = "wh_load"

[[pipeline]]
id = "wh_load"
kind = "build"
title = "웨어하우스 · 마트 · 상품"
dags = { wh_load = "asset", agent_triage = "*/30 * * * *" }  # agent_triage: 관문 거절·dbt 실패 신호의 1차 대응(결정 112)
records = "build_runs"
trigger = "Asset"
chain = "원본·stg 갱신 → dbt build → 교체 → 내보내기"
engines = ["dbt", "PostgreSQL", "PostGIS"]
summary = "어느 출처든 원본이나 stg가 갱신되면 돈다. 빌드용 스키마에 전부 다시 만들고, 테스트를 모두 통과하면 stg_dbt·wh·mart를 한 트랜잭션에서 바꾼 뒤 계약을 검사하고 상품을 내보낸다."
meta = [["트리거", "raw.congestion · raw.rent · raw.sbiz_store · stg.* 중 하나"], ["pool", "heavy + advisory lock"], ["재시도", "0"], ["끝나면", "wh.built Asset → lineage"]]
flow_note = "전부 되거나 전부 안 된다"
failures = ["F-4", "F-6"]
scenario = "모든 시나리오의 마지막 단계"
proofs = [
  ["원자성", "둘째 스키마를 빼고 실패 주입 → 첫째 교체도 취소", "결정 32, 61"],
  ["결정적 출력", "정렬 키를 모든 독립 컬럼으로, 같은 데이터면 상품 sha256 같음", "측정 8, 결정 33"],
  ["빌드 시간", "dbt 전체 131.8초 → 상가정보 전체로 넓힌 뒤 339.7초 → 경계 인덱스 뒤 95.4초 (fact_store 140.5초 → 5.41초)", "측정 25, 27, 40"],
  ["0행 검사", "상품 표가 0행이면 내보내지 않음. 유도 시험 rc=1, 상품 폴더 그대로", "guarantees 3절"],
]
[[pipeline.lane]]
name = "입력"
engine = "Asset"
items = [["raw.* · stg.*", "출처 파이프라인이 갱신"]]
[[pipeline.lane]]
name = "빌드"
engine = "dbt"
items = [["drop_build_schemas", "지난 실패 흔적 지움"], ["dbt build", "*_build 스키마에 전체 · 테스트 포함"]]
[[pipeline.lane]]
name = "기록"
engine = "Python"
items = [["build_record", "ops.build_run (SQL 해시, 커밋), ops.build_diff"]]
[[pipeline.lane]]
name = "교체"
engine = "dbt 매크로"
items = [["swap_schemas", "stg_dbt · wh · mart 한 트랜잭션"]]
[[pipeline.lane]]
name = "내보내기"
engine = "Python"
items = [["export_product", "계약 스키마와 비교, 다르면 실패"], ["product/v날짜", "csv · parquet + manifest"]]
[[pipeline.lane]]
name = "출력"
engine = "Asset"
items = [["wh.built", "lineage 깨움"]]
[pipeline.form.trigger]
assets = "AssetAny(raw.congestion, raw.rent, raw.sbiz_store, stg.*)"
pool = "heavy, advisory lock(python -m common lock)"
[pipeline.form.build]
command = "dbt run-operation drop_build_schemas && dbt build"
target = "stg_dbt_build, wh_build, mart_build"
[pipeline.form.record]
module = "warehouse.build_record"
writes = "ops.build_run, ops.build_diff (결정 81)"
[pipeline.form.swap]
macro = "swap_schemas([stg_dbt, wh, mart])"
atomic = "한 트랜잭션, 실패 시 모두 취소"
[pipeline.form.export]
module = "warehouse.export_product"
contract = "계약 파일과 컬럼·타입 비교, 깨는 변경은 실패 (결정 83)"
next = "wh.built → lineage"

[[pipeline]]
id = "lineage"
kind = "build"
title = "컬럼 리니지"
dags = { lineage = "asset" }
records = "lineage_runs"
trigger = "Asset"
chain = "컴파일 SQL → sqlglot (Spark 병렬) → PostgreSQL → MCP"
engines = ["Spark", "sqlglot", "PostgreSQL", "MCP"]
summary = "상품을 내보낸 뒤 돈다. dbt가 컴파일한 SQL과 Spark SQL 묶음을 DB 없이 파싱해 컬럼 간선(값·행·행 집합)을 뽑고 회차로 저장한다. MCP로 영향 범위를 묻는다."
meta = [["트리거", "wh.built (상품 내보내기 뒤)"], ["pool", "heavy"], ["저장", "lineage.run · lineage.edge_raw + 뷰"], ["조회", "MCP stdio, lineage_reader 역할"]]
flow_note = "실패해도 상품은 막지 않는다 (결정 50)"
failures = ["F-5", "F-7", "F-10", "F-11"]
scenario = "S4 값 표기가 바뀌면 어디가 영향받나 (데이터 지도에서 직접)"
proofs = [
  ["정답 대조", "정답을 파서보다 먼저 커밋, DIRECT 78/0/0 · INDIRECT 218/0/0", "측정 19"],
  ["변이 시험", "raw 변이 7개 놓침 0", "측정 31"],
  ["정밀도 개선", "출처별 관문 분리 뒤 M1 10% → 80%, M7 45% → 90%", "측정 35, F-7"],
]
[[pipeline.lane]]
name = "입력"
engine = "dbt target"
items = [["manifest · compiled", "SQL 모델"], ["spark_sql/living", "Spark SQL 묶음"]]
[[pipeline.lane]]
name = "스키마 추론"
engine = "Python"
items = [["schema.py", "DDL + seed + 의존 순서대로 qualify"]]
[[pipeline.lane]]
name = "간선 추출"
engine = "Spark"
items = [["edges.py", "모델마다 병렬 (parallelize)"], ["spark_sql.py · product.py", "묶음 · 상품 층"]]
[[pipeline.lane]]
name = "저장"
engine = "PostgreSQL"
items = [["lineage.edge_raw", "회차별 간선"]]
[[pipeline.lane]]
name = "조회"
engine = "MCP"
items = [["downstream · upstream", "값·행·행 집합 경로"], ["run_diff", "회차 간 지도 변화"]]
[pipeline.form.trigger]
asset = "wh.built (file:///opt/project/product)"
pool = "heavy"
[pipeline.form.extract]
parser = "sqlglot 30.31.0"
schema = "DB 없이 추론 (결정 53)"
kinds = "DIRECT, INDIRECT, ROWSET (결정 46, 80)"
[pipeline.form.store]
tables = "lineage.run, lineage.edge_raw"
views = "table_edge, downstream, upstream, run_diff"
stale = "SQL 해시와 작업 트리 깨끗 여부 (결정 81)"
[pipeline.form.serve]
mcp = "stdio, 도구 5개, lineage_reader"

