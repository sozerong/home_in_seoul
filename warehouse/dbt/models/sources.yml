# Python 정제가 채우는 스테이징(warehouse/sql/01~06). dbt는 읽기만 한다 (결정 30 D1).
sources:
  - name: raw  # Python이 파싱만 해서 원천 모양(jsonb)으로 담는 원본 (warehouse/sql/09, 결정 42, 60)
    schema: "{{ var('raw_schema', 'raw') }}"  # S1 실험(measure)만 바꾼다
    tables:
      - name: congestion
      - name: rent  # warehouse/sql/10 (결정 72)
      - name: sbiz_store  # warehouse/sql/11 (결정 78)
  - name: stg
    schema: "{{ var('source_schema', 'stg') }}"  # 변이 시험(measure/lineage_mutation.py)만 stg_mut으로 바꾼다
    tables:
      - name: sgis_dong
      - name: sbiz_store
      - name: parcel
      - name: station_master
      - name: living_batch_status  # 생활이동 관문 판정. 실행기 --save가 쓴다(warehouse/sql/12, 판단 64)
      - name: living_commute  # 생활이동 경계 표. Spark SQL 실행기가 쓴다(warehouse/sql/12, spark_sql/living, 결정 88~90, 96)
        columns:  # 08 검사: 2021 대응표에 없는 생활이동 코드
          - name: origin_cd
            data_tests:
              - relationships:
                  arguments: {to: ref('map_dong_2021'), field: dong_cd_2021}
          - name: dest_cd
            data_tests:
              - relationships:
                  arguments: {to: ref('map_dong_2021'), field: dong_cd_2021}
