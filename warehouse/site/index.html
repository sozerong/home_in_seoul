<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#e2e5ea;--text:#1d2330;--muted:#5d6675;--accent:#2457c5;--accent-bg:#eaf0fd;--ok:#1d7a46;--warn:#9a5b00;--err:#b42318;--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}

header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;padding:0 18px;height:52px;background:#14213d;color:#fff}

.badge.gray{background:#eef0f3;color:var(--muted)}.badge.warn{background:#fff3df;color:var(--warn)}.badge.ok{background:#e5f5ec;color:var(--ok)}

aside{background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow:auto;max-height:calc(100vh - 52px);position:sticky;top:52px}
aside input[type=search]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px}

.dslink{display:block;padding:7px 8px;border-radius:6px;color:var(--text)}
.dslink:hover{background:var(--bg);text-decoration:none}.dslink.on{background:var(--accent-bg)}
.dslink .t{font-weight:600}.dslink .s{font-size:12px;color:var(--muted)}

main{padding:22px 28px;min-width:0}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:26px 0 10px}h3{font-size:14px;margin:18px 0 8px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
a.card{color:var(--text)}a.card:hover{border-color:var(--accent);text-decoration:none}
.card .t{font-weight:700;margin-bottom:2px}.card .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.card .g{color:var(--muted);font-size:12.5px;margin:6px 0}

table.grid{border-collapse:separate;border-spacing:0;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
table.grid th,table.grid td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}

.tabs a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}.tabs a:hover{text-decoration:none;color:var(--text)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,.btn{font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:#b9c0cc;text-decoration:none}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.primary:hover{background:#1c48a8}
button:disabled{opacity:.55;cursor:default}
.note{color:var(--muted);font-size:12.5px}
.err{color:var(--err);white-space:pre-wrap;background:#fdecea;border:1px solid #f6c7c2;border-radius:6px;padding:8px 10px;margin:8px 0}
pre.code{background:#0f172a;color:#e2e8f0;padding:12px 14px;border-radius:8px;overflow:auto;margin:6px 0 4px}

.profile{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.pcard .n{font-family:var(--mono);font-weight:600}
.stats{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:12.5px;margin-top:8px}
.stats span:nth-child(odd){color:var(--muted)}
.hist{display:flex;align-items:flex-end;gap:2px;height:64px;margin-top:10px;border-bottom:1px solid var(--line)}
.hist div{flex:1;background:#8fb0ec;min-height:1px;border-radius:2px 2px 0 0}
.hist div:hover{background:var(--accent)}
.hl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:6px;align-items:center;font-size:12.5px;margin:3px 0}
.bar .b{position:relative;background:#f1f3f6;border-radius:4px;overflow:hidden;padding:2px 6px;white-space:nowrap;text-overflow:ellipsis}
.bar .b i{position:absolute;left:0;top:0;bottom:0;background:#dbe6fb;z-index:0}.bar .b span{position:relative}
.bar .c{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

/* SQL */
.sqlwrap{display:grid;grid-template-rows:auto auto auto 1fr;gap:10px;min-height:calc(100vh - 100px)}
#sql{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.55;background:#fff;tab-size:2}

.status{font-size:12.5px;color:var(--muted)}

.result table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.result th{position:sticky;top:0;background:#f1f3f6;cursor:pointer;user-select:none;white-space:nowrap;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
.result th small{color:var(--muted);font-weight:400;margin-left:4px}
.result td{padding:4px 10px;border-bottom:1px solid #eef0f3;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
.result td.num{text-align:right;font-variant-numeric:tabular-nums}.result td.null{color:#a0a7b4;font-style:italic}
.result tr:hover td{background:#f8fafc}
.tree details{margin:2px 0}.tree summary{cursor:pointer;padding:3px 4px;border-radius:4px;font-weight:600}
.tree summary:hover{background:var(--bg)}
.tree .col{display:flex;justify-content:space-between;gap:6px;padding:2px 6px 2px 18px;font-family:var(--mono);font-size:12px;cursor:pointer;border-radius:4px}
.tree .col:hover{background:var(--accent-bg)}.tree .col span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tree .col em{color:var(--muted);font-style:normal;white-space:nowrap}
.sqlwrap>*{min-width:0}
.chart{padding:12px 14px}.chart .bar{grid-template-columns:minmax(80px,220px) 1fr 90px}.chart .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.hist-list{font-size:12.5px}.hist-list a{display:block;padding:3px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);font-family:var(--mono)}
.hist-list a:hover{background:var(--bg);text-decoration:none}
.rel{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;font-size:13px;align-items:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.on{opacity:1}
.loading{color:var(--muted);padding:20px 0}
.notes{background:#fff8e6;border:1px solid #f1d9a6;border-radius:10px;padding:12px 16px;margin:0 0 16px}.notes b{display:block;margin-bottom:4px}.notes ul{margin:4px 0 0;padding-left:18px}.notes .ref{color:var(--muted);font-size:11.5px}
.guide{background:var(--accent-bg);border:1px solid #c9d8f7;border-radius:10px;padding:14px 16px;margin:10px 0 6px}.guide ol{margin:6px 0 0;padding-left:20px}
.lbl{font-weight:600}.eng{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.hint{background:#fff;border:1px dashed #f6c7c2;border-radius:6px;padding:8px 12px;font-size:12.5px;margin:0 0 8px}.hint ul{margin:4px 0 0;padding-left:18px}
details.ref{display:inline-block;color:var(--muted);font-size:11.5px;margin-left:4px}details.ref summary{cursor:pointer;text-decoration:underline dotted}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0 6px}.pcard .kv{display:grid;grid-template-columns:7.5em 1fr;gap:6px 14px;margin:8px 0 0}.pcard dt{color:var(--muted);font-weight:600}.pcard dd{margin:0}.pcard ol{margin:0;padding-left:18px}
.faq dt{font-weight:600;margin-top:12px}.faq dd{margin:4px 0 0 0;color:var(--text)}.faq .ref{color:var(--muted);font-size:11.5px}
@media (max-width:860px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}header nav a{padding:6px 6px}header .brand{display:none}}
</style>

<script type="module">
// 서버 없는 데이터 포털: catalog.json·manifest·profiles/<버전>.json만 읽고, SQL과 미리보기는 브라우저 안 DuckDB-WASM이
// 이 사이트의 공개 Parquet를 직접 읽는다. 질의와 결과는 어떤 서버로도 보내지 않는다.
const DUCKDB_ESM = window.DUCKDB_ESM || 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.33.1-dev57.0/+esm';
const SHOW_ROWS = 1000;      // 결과 표에 그리는 행 수
const KEEP_ROWS = 20000;     // 정렬을 위해 브라우저 메모리에 꺼내 두는 최대 행 수. CSV 내려받기는 전체 행

const LABELS = {
  sources: {rent_months: '전월세 계약월', rent_collected_date: '전월세 수집일', commute_months: '생활이동 대상월',
    congestion_collected_date: '혼잡도 수집일(혼잡도 컬럼은 비공개)', store_collected_date: '상가정보 수집일', boundary_base_date: '행정동 경계 기준일'},
  quality: {rent_quarantine_rows: '전월세 검증 제외 행', commute_quarantine_rows: '생활이동 검증 제외 행', dongs_without_mois_code: '행정안전부 코드가 없는 행정동',
    commute_pairs_age20_34_basis: '20~34세 기준 출근 경로', commute_pairs_all_ages_basis: '전체 연령으로 대체한 출근 경로',
    dongs_without_monthly_rent_deal: '월세 계약이 없는 행정동'},
  // 품질 지표 설명. 근거: data_contract.md 3·4절, docs/public_columns.json의 컬럼 설명
  qualityMeaning: {
    rent_quarantine_rows: '검증 규칙을 통과하지 못해 제외한 전월세 원본 행 수입니다. 공개 파일에는 포함되지 않습니다.',
    commute_quarantine_rows: '검증에서 제외한 생활이동 원본 행 수입니다. 출근 분석에 쓰지 않는 행(출근 외 이동 유형, 주말, 오전 7~9시 외 도착)과 오류 비율이 기준을 넘어 통째로 받지 않은 달의 행이 함께 포함돼 있어, commute_od 계산에서 빠진 행 수와는 다릅니다. 사유별 내역은 제공하지 않습니다.',
    dongs_without_mois_code: '행정안전부 행정동 코드(mois_dong_cd)를 대응하지 못한 행정동 수입니다.',
    commute_pairs_age20_34_basis: 'commute_od에서 권장 평균 이동 시간(avg_minutes)을 20~34세 값으로 계산한 경로 수입니다(basis = age20_34).',
    commute_pairs_all_ages_basis: '20~34세 이동인구가 30 미만이라 전체 연령 값으로 대체한 경로 수입니다(basis = all_ages).',
    dongs_without_monthly_rent_deal: '기간 내 신규 월세 계약이 없는 행정동 수입니다. 이 행정동은 dong_profile의 월세 계약 수와 월세 중앙값이 0이 아니라 NULL입니다.',
  },
};
const EXAMPLES = [
  ['테이블별 행 수', '테이블 4개의 행 수', `-- 테이블 4개의 행 수
SELECT 'dong_profile' AS table_name, count(*) AS rows FROM dong_profile
UNION ALL SELECT 'commute_od', count(*) FROM commute_od
UNION ALL SELECT 'rent_listing', count(*) FROM rent_listing
UNION ALL SELECT 'dong_mois_map', count(*) FROM dong_mois_map;`],
  ['컬럼 요약 통계 (SUMMARIZE)', '전월세 계약 컬럼별 최솟값·최댓값·NULL 비율', `-- 컬럼별 최솟값, 최댓값, 고유값 수, NULL 비율
SUMMARIZE rent_listing;`],
  ['자치구별 오피스텔 월세 중앙값', '자치구별 오피스텔 신규 월세 계약의 월세 중앙값', `-- 자치구(sgg_cd)별 오피스텔 월세 중앙값(만원)
-- rent_listing에는 자치구 코드가 없어 dong_id로 dong_profile과 조인
SELECT p.sgg_cd,
       count(*) AS deals,                                         -- 계약 수
       quantile_cont(r.monthly_rent_10k_won, 0.5) AS median_rent_10k_won  -- 월세 중앙값(만원)
FROM rent_listing r
JOIN dong_profile p USING (dong_id)
WHERE r.source_type = 'offi'          -- 오피스텔만
  AND r.lease_type = '월세'
  AND r.monthly_rent_10k_won > 0
GROUP BY p.sgg_cd
ORDER BY median_rent_10k_won DESC;`],
  ['강남구 행정동 목록', '강남구 행정동과 월세 중앙값', `-- 강남구의 통계청 자치구 코드는 문자열 '11230'(행정안전부 코드 11680과 다름)
SELECT dong_id, dong_nm, monthly_deals, monthly_median_rent_10k_won
FROM dong_profile
WHERE sgg_cd = '11230'
ORDER BY dong_nm;`],
  ['역삼1동 출근 60분 또는 3km 이내 + 월세', '역삼1동으로 출근하기 좋은 행정동과 월세 중앙값', `-- 직장이 역삼1동일 때 출발 행정동별 20~34세 평균 이동 시간과 월세 중앙값
-- 생활이동 이동 시간은 체류지 사이 시간이라 가까운 동일수록 실제보다 길게 나옴
-- 그래서 직선거리 3km 이내 조건을 함께 사용
SELECT o.dong_nm AS origin_dong_nm,
       c.avg_minutes_age20_34,             -- 20~34세 평균 이동 시간(분)
       c.distance_km,                      -- 두 행정동 대표점 사이 직선거리(km)
       o.monthly_median_rent_10k_won,      -- 출발 행정동 월세 중앙값(만원)
       o.monthly_median_deposit_10k_won,
       o.nearest_station_nm
FROM commute_od c
JOIN dong_profile o ON o.dong_id = c.origin_dong_id
WHERE c.dest_dong_id = (SELECT dong_id FROM dong_profile WHERE dong_nm = '역삼1동')
  AND (c.avg_minutes_age20_34 <= 60 OR c.distance_km <= 3)
ORDER BY o.monthly_median_rent_10k_won NULLS LAST;`],
  ['계약월별 전세·월세 건수', '계약월별 전세·월세 계약 수', `-- 계약년월(deal_ymd)별 전세·월세 계약 수. 최근 달은 신고 기한(계약 후 30일)이 남아 적을 수 있음
SELECT deal_ymd, lease_type, count(*) AS deals
FROM rent_listing
GROUP BY ALL
ORDER BY deal_ymd, lease_type;`],
  ['편의점 수 상위 20개 행정동', '편의점이 많은 행정동 20곳', `-- 행정동 경계 안 업소 수(곳). 면적당 밀도는 이용조건상 비공개
SELECT dong_nm, sgg_cd, convenience_store, pharmacy, laundry
FROM dong_profile
ORDER BY convenience_store DESC
LIMIT 20;`],
  ['스키마 보기 (DESCRIBE)', 'commute_od의 컬럼 이름과 타입', `-- 컬럼 이름과 타입
DESCRIBE commute_od;`],

// ---------- DuckDB-WASM ----------
async function getConn(status) {
  if (S.conn) return S.conn;
  status?.('SQL 엔진(DuckDB-WASM)을 불러오는 중입니다. 처음 한 번은 몇 초 걸릴 수 있습니다.');
  const duckdb = await import(DUCKDB_ESM);
  const bundle = await duckdb.selectBundle(window.DUCKDB_BUNDLES || duckdb.getJsDelivrBundles());
  // CDN의 워커 스크립트는 다른 출처라 바로 못 띄운다: 같은 출처의 Blob URL로 감싼다
  const workerUrl = URL.createObjectURL(new Blob([`importScripts("${bundle.mainWorker}");`], {type: 'text/javascript'}));
  const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(duckdb.LogLevel.WARNING), new Worker(workerUrl));
  await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
  URL.revokeObjectURL(workerUrl);
  await db.open({query: {castDecimalToDouble: true}});
  S.conn = await db.connect();
  S.engine = duckdb.PACKAGE_VERSION;
  return S.conn;
}
async function ensureViews(status) {
  const conn = await getConn(status);
  if (S.viewsFor === S.version) return conn;
  for (const d of S.catalog.datasets) {
    const url = absUrl(fileOf(d, 'parquet').url).replaceAll("'", "''");
    await conn.query(`CREATE OR REPLACE VIEW "${d.identifier}" AS SELECT * FROM read_parquet('${url}')`);
  }
  S.viewsFor = S.version;
  return conn;
}
function cell(v, type) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'bigint') return Number(v);
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  if (typeof v === 'number' && type.startsWith('Date')) return new Date(v).toISOString().slice(0, 10);
  if (typeof v === 'number' && type.startsWith('Timestamp')) return new Date(v).toISOString().replace('T', ' ').slice(0, 19);
  if (typeof v === 'object') return JSON.stringify(v, (k, x) => typeof x === 'bigint' ? Number(x) : x);
  return v;
}
function arrowToRows(table, limit) {
  const fields = table.schema.fields.map((f) => ({name: f.name, type: String(f.type)}));
  const n = Math.min(table.numRows, limit), rows = new Array(n);
  const cols = fields.map((f, j) => table.getChildAt(j));
  for (let i = 0; i < n; i++) rows[i] = cols.map((c, j) => cell(c.get(i), fields[j].type));
  return {fields, rows, total: table.numRows};
}
function gridHtml(res, sortable) {
  const isNum = res.fields.map((f) => /Int|Float|Decimal|Double/.test(f.type));
  const head = res.fields.map((f, j) => {
    const arrow = S.sort && sortable && S.sort.j === j ? (S.sort.dir > 0 ? ' ▲' : ' ▼') : '';
    return `<th data-j="${j}" title="${esc(f.type)}">${esc(f.name)}<small>${esc(shortType(f.type))}</small>${arrow}</th>`;
  }).join('');
  const body = res.rows.slice(0, SHOW_ROWS).map((r) => '<tr>' + r.map((v, j) => v === null
    ? '<td class="null">NULL</td>' : `<td class="${isNum[j] ? 'num' : ''}" title="${esc(v)}">${esc(isNum[j] && typeof v === 'number' ? fmtNum(v, 6) : v)}</td>`).join('') + '</tr>').join('');
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}
function shortType(t) { return t.replace(/<.*>/, '').replace('Float64', 'double').replace('Utf8', 'text').replace('Int64', 'bigint').replace('Int32', 'int').replace('DateDay', 'date').toLowerCase(); }
function toCsv(table) {
  const fields = table.schema.fields.map((f) => ({name: f.name, type: String(f.type)}));
  const cols = fields.map((f, j) => table.getChildAt(j));
  const q = (v) => v === null ? '' : /[",\n\r]/.test(String(v)) ? '"' + String(v).replaceAll('"', '""') + '"' : String(v);
  const out = [fields.map((f) => q(f.name)).join(',')];
  for (let i = 0; i < table.numRows; i++) out.push(cols.map((c, j) => q(cell(c.get(i), fields[j].type))).join(','));
  return '﻿' + out.join('\r\n') + '\r\n';
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

      h.push('</div><div style="margin-top:8px">');

function changesHtml(v, table) {

    ...Object.entries(c.removed).filter(([k]) => mine(k)).map(([k, r]) => `삭제: ${k} (${r})`),
    ...c.type_changed.filter((x) => mine(x.column)).map((x) => `형 변경: ${x.column} ${x.from} → ${x.to} (${x.reason})`),
    ...(c.rows[table] ? [`행 수: ${nf.format(c.rows[table][0])} → ${nf.format(c.rows[table][1])}`] : [])];

      st.textContent = `실행 계획 · ${ms} ms`; return;
    }
    const r = arrowToRows(table, KEEP_ROWS);
    S.last = {table, res: r};
    drawResult();
    const more = r.total > SHOW_ROWS ? ` · 상위 ${nf.format(SHOW_ROWS)}행만 표시(정렬은 상위 ${nf.format(Math.min(r.total, KEEP_ROWS))}행 기준, CSV는 전체 행)` : '';
    st.textContent = `${nf.format(r.total)}행 · 컬럼 ${r.fields.length} · ${ms} ms · 버전 ${S.version} · DuckDB-WASM ${S.engine}${more}`;
    $('#csv').disabled = !r.total;
    $('#chart').disabled = !r.total || !r.fields.some(isNumField);
    pushHistory(q + ';');
  } catch (e) {
    st.textContent = '';
    err.innerHTML = `<div class="err">${esc(e.message || e)}</div>${sqlHint(e.message || String(e))}`;
  } finally { $('#run').disabled = false; }
}

const isNumField = (f) => /Int|Float|Decimal|Double/.test(f.type);
// SQL 오류 아래에 붙이는 흔한 원인 안내. 오류 글에 맞는 줄을 먼저 보여 준다
function sqlHint(msg) {
  const tips = [
    // 따옴표 없이 쓴 한글 값(= 역삼1동)은 DuckDB가 "Referenced column ... not found"로 알린다: 따옴표 안내를 먼저
    [/Parser Error|syntax error|column "[^"]*[가-힣][^"]*" not found/i, "문자열 값은 작은따옴표로 감쌉니다. 예: dong_nm = '역삼1동', lease_type = '월세'"],
    [/does not exist|not found|Referenced column|Catalog Error|Binder Error/i, '테이블·컬럼 이름에 오타가 있을 수 있습니다. 왼쪽 목록에서 컬럼을 클릭하면 정확한 이름이 삽입됩니다.'],
    [/Conversion Error|Could not convert|No function matches|Cannot compare/i, "코드 컬럼(dong_id, sgg_cd 등)은 문자열 타입입니다. '11230'처럼 작은따옴표로 감싸 주세요."],
  ];
  const hit = tips.filter(([re]) => re.test(msg)), rest = tips.filter((t) => !hit.includes(t));
  return `<div class="hint"><b>자주 발생하는 원인</b><ul>${[...hit, ...rest].map(([, t]) => `<li>${esc(t)}</li>`).join('')}</ul></div>`;
}
function drawResult() {
  const r = S.last?.res, el = $('#res'); if (!r) return;
  if (!r.fields.length) { el.innerHTML = '<p class="note" style="padding:10px">결과 컬럼이 없습니다.</p>'; return; }
  if (!S.chart || !r.fields.some(isNumField)) { el.innerHTML = gridHtml(r, true); return; }
  const vj = r.fields.findIndex(isNumField), lj = r.fields.findIndex((f) => !isNumField(f));
  const rows = r.rows.slice(0, 60), vals = rows.map((x) => x[vj] ?? 0), mx = Math.max(...vals.map(Math.abs), 1e-12);
  el.innerHTML = `<div class="chart"><p class="note">값: <b class="mono">${esc(r.fields[vj].name)}</b> · 라벨: <b class="mono">${lj >= 0 ? esc(r.fields[lj].name) : '행 번호'}</b> · 상위 ${rows.length}행 (현재 정렬 순서)</p>` +
    rows.map((x, i) => `<div class="bar"><div class="lab" title="${esc(lj >= 0 ? x[lj] : i + 1)}">${esc(lj >= 0 ? (x[lj] ?? 'NULL') : i + 1)}</div><div class="b"><i style="width:${100 * Math.abs(vals[i]) / mx}%"></i><span>&nbsp;</span></div><div class="c">${x[vj] === null ? 'NULL' : fmtNum(x[vj], 3)}</div></div>`).join('') + '</div>';
}

async function route() {
  const [path, qs] = (location.hash.slice(1) || '/').split('?');
  const params = new URLSearchParams(qs || '');
  const parts = path.split('/').filter(Boolean);
  const page = parts[0] === 't' ? 'table' : parts[0] || 'home';
  for (const a of document.querySelectorAll('header nav a')) a.classList.toggle('on', a.dataset.nav === (page === 'table' ? 'home' : page));
  renderSide(page === 'table' ? parts[1] : page);
  window.scrollTo(0, 0);
  try {
    if (page === 'table') await viewTable(parts[1], parts[2], params);
    else if (page === 'sql') viewSql(params);
    else if (page === 'sources') await viewSources();
    else if (page === 'help') await viewHelp();
    else await viewHome();
  } catch (e) { $('#main').innerHTML = `<p class="err">${esc(e.message || e)}</p>`; console.error(e); }
}

    S.catalog = await getJson('catalog.json');
    Object.assign($('#contact'), {href: S.catalog.card.contact_url, title: S.catalog.card.contact_label, hidden: false});
    const want = new URLSearchParams(location.search).get('v');
    S.version = S.catalog.versions.some((v) => v.version === want) ? want : S.catalog.latest;
    $('#ver').innerHTML = S.catalog.versions.map((v) => `<option value="${esc(v.version)}" ${v.version === S.version ? 'selected' : ''}>${esc(v.version)}${v.version === S.catalog.latest ? ' (최신)' : ''}</option>`).join('');
    $('#ver').onchange = (e) => { S.version = e.target.value; route(); };
    await route();
  } catch (e) { $('#main').innerHTML = `<p class="err">데이터 목록(catalog.json)을 불러오지 못했습니다: ${esc(e.message || e)}</p>`; }
})();
</script>
</body>
</html>
