services:
  db:
    image: postgis/postgis:17-3.5
    # 자원 상한(결정 101, resource_guard.md L2, 측정 37): db 최대 3.20GiB(dbt 전체 빌드 중) x 1.2 = 3.84 -> 4g. 같은 값의 memswap_limit = 컨테이너 스왑 금지.
    # 넘치면 이 컨테이너만 cgroup OOM으로 죽고 OOMKilled=true로 드러난다. 다시 만들지 않고 바꿀 때: docker update --memory 4g --memory-swap 4g <컨테이너>
    mem_limit: 4g
    memswap_limit: 4g
    environment:
      POSTGRES_USER: seoul
      POSTGRES_DB: seoul
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # 5432는 이 PC의 Windows PostgreSQL 서비스가 이미 쓰고 있어서 5433으로 노출한다.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # DB가 접속을 받을 준비가 됐는지 10초마다 본다. Airflow는 이게 통과할 때까지 기다렸다 켜진다.
      test: ["CMD-SHELL", "pg_isready -U seoul -d seoul"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    build: .
    image: seoul-airflow:3.3.2
    # 자원 상한(결정 101, resource_guard.md L2, 측정 37): VM 30.91GiB - 이웃 상한(db 4 + metabase 2 + pgadmin 0.5) - OS·페이지 캐시 2 = 22.41 -> 22g. 그중 평시 몫(최대 1.34 x 1.2 = 1.61)을 뺀 약 20.4GiB가 무거운 작업 몫. 같은 값의 memswap_limit = 컨테이너 스왑 금지.
    # 넘치면 이 컨테이너만 cgroup OOM으로 죽고 OOMKilled=true로 드러난다. 다시 만들지 않고 바꿀 때: docker update --memory 22g --memory-swap 22g --cpus 12 <컨테이너>
    mem_limit: 22g
    memswap_limit: 22g
    cpus: 12
    # 개발용 한 컨테이너 실행: 스케줄러, 화면(API 서버), DAG 처리기, 트리거러를 함께 띄운다 (결정 19).
    command: standalone
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 컨테이너 기본 시간대는 UTC라 한국 새벽 4시가 전날 19시가 된다. 수집일 폴더가 하루 어긋나지 않게 한다.
      TZ: Asia/Seoul
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://seoul:${POSTGRES_PASSWORD}@db:5432/airflow
      # 내 PC에서만 여는 개발용이라 로그인 없이 모두 관리자로 둔다. 포트를 127.0.0.1에만 열어 다른 기기에서는 접속할 수 없다.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # 컨테이너 안에서 스크립트가 쓸 데이터 DB 주소. .env의 localhost:5433을 덮어쓴다 (common.read_env).
      DATABASE_URL: postgresql://seoul:${POSTGRES_PASSWORD}@db:5432/seoul
      # dbt 접속 설정(warehouse/dbt/profiles.yml)이 읽는다. dbt-postgres는 주소 한 줄(URL)을 받지 않는다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./:/opt/project
      - ./dags:/opt/airflow/dags
      # 작업 공간(Spark 셔플·spill, DuckDB 임시) 전용 볼륨(결정 107 S4, resource_guard.md 7.6). 컨테이너 쓰기 층과 분리해
      # 크기를 따로 보고 비운다. 같은 Docker 가상 디스크 안이라 호스트 C:로 돌려받으려면 여전히 회수(S2)가 필요하다.
      - scratch:/scratch
    ports:
      - "127.0.0.1:8080:8080"

  pgadmin:
    # 브라우저에서 DB에 SQL을 던져 보는 개발용 화면. 파이프라인은 쓰지 않는다.
    image: dpage/pgadmin4:9.10
    # 자원 상한(결정 101, resource_guard.md L2, 측정 37): 최대 0.26GiB x 1.2 = 0.31 -> 512m. 같은 값의 memswap_limit = 컨테이너 스왑 금지.
    # 넘치면 이 컨테이너만 cgroup OOM으로 죽고 OOMKilled=true로 드러난다. 다시 만들지 않고 바꿀 때: docker update --memory 512m --memory-swap 512m <컨테이너>
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 데스크톱 모드: pgAdmin 로그인 없이 연다. Airflow처럼 127.0.0.1에만 열어 다른 기기에서는 접속할 수 없다.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # 이미지가 시작할 때 요구하는 값. 데스크톱 모드에서는 로그인에 쓰이지 않는다.
      PGADMIN_DEFAULT_EMAIL: dev@example.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # DB 서버(seoul)를 미리 등록해 둔다. DB 비밀번호는 처음 접속할 때 화면에서 한 번 입력한다.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:5050:80"

  metabase:
    # 파이프라인 운영 대시보드 (결정 38). 화면 설정은 전용 DB에, 데이터는 읽기 전용 계정으로 본다 (warehouse/metabase_setup.py).
    image: metabase/metabase:v0.64.5.2
    # 자원 상한(결정 101, resource_guard.md L2, 측정 37): 최대 1.64GiB(JVM) x 1.2 = 1.96 -> 2g. 같은 값의 memswap_limit = 컨테이너 스왑 금지.
    # 넘치면 이 컨테이너만 cgroup OOM으로 죽고 OOMKilled=true로 드러난다. 다시 만들지 않고 바꿀 때: docker update --memory 2g --memory-swap 2g <컨테이너>
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: seoul
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      JAVA_TIMEZONE: Asia/Seoul
      # 사용 통계 전송과 새 버전 확인을 끈다.
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  pgadmin_data:
  scratch: