# 공개 사이트 자동 배포 (결정 118, handoff_deploy.md D2). 코드 레포 main에 사이트에 쓰이는 파일이 머지되면
# 데이터 레포(sozerong/home_in_seoul-data)의 사이트 파일만 다시 만들어 푸시한다. 공개 버전 폴더(vYYYY.MM.DD/)는 건드리지 않는다.
# 새 데이터 버전 공개는 여기서 하지 않는다(결정 119: 사람이 고른 버전만 README 5절 순서로).
# 비밀 값: DATA_REPO_DEPLOY_KEY = 데이터 레포 하나에만 쓰기 권한이 있는 deploy key의 개인 키(README 5절에 만드는 법).
name: deploy-site

on:
  push:
    branches: [main]
    paths:  # publish_site.py --site-only가 읽는 파일과 이 워크플로 자체
      - warehouse/site/**
      - warehouse/publish_site.py
      - warehouse/export_product.py  # publish_site가 schema_changes를 가져다 쓴다
      - common.py
      - requirements.txt
      - docs/public_columns.json
      - docs/product_contract.json
      - docs/data_contract.md
      - .github/workflows/deploy_site.yml
  workflow_dispatch:  # 손으로 다시 돌릴 때(Actions 화면의 Run workflow)

permissions:
  contents: read  # 코드 레포는 읽기만. 데이터 레포 쓰기는 deploy key로만 한다

concurrency:  # 두 머지가 겹치면 차례로 돈다(뒤 실행이 앞 실행의 푸시 위에서 다시 만든다)
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: sozerong/home_in_seoul-data
          ref: main
          path: _data
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}  # 뒤의 git push도 이 키를 쓴다(persist-credentials 기본값)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # ci.yml, Dockerfile과 같은 버전

      - name: 사이트 파일만 다시 만들기 (공개 버전 폴더는 manifest와 맞는지 보고 읽기만)
        run: |
          pip install -r requirements.txt
          python -m warehouse.publish_site --site-only --out _data

      - name: 바뀐 것만 커밋하고 푸시
        working-directory: _data
        run: |
          set -euo pipefail
          # 줄바꿈 변환이 꺼져 있어야 CSV 바이트가 manifest sha256과 같게 남는다(F-37)
          git check-attr text -- "$(git ls-files 'v*/*.csv' | head -n 1)" | grep -q 'text: unset' \
            || { echo "::error::.gitattributes(* -text)가 적용되지 않았습니다"; exit 1; }
          git add -A
          if git diff --cached --quiet; then
            echo "바뀐 사이트 파일이 없어 커밋하지 않습니다"
            exit 0
          fi
          # 공개 버전 폴더는 불변이다. publish_site의 검사와 따로 git으로 한 번 더 본다
          if git diff --cached --name-only | grep -E '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}/'; then
            echo "::error::공개 버전 폴더가 바뀌어 푸시하지 않습니다"
            exit 1
          fi
          git diff --cached --stat
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "사이트 갱신: ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin HEAD:main
